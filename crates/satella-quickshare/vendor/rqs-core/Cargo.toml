[package]
name = "satella-quickshare-vendor"
version = "0.11.5"
edition = "2021"
license = "GPL-3.0"
publish = false

# Vendored from Martichou/rquickshare (GPL-3.0), upstream commit
# 378d8ae969941bee4bf60ad34ac9cf8bb7005eb7.
#
# The package is renamed so it cannot collide with the upstream `rqs_lib`
# crate. The TypeScript binding export in build.rs was dropped; the sources
# are otherwise upstream's.

[lib]
name = "satella_quickshare_vendor"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
directories = "6.0"
futures = "0.3"
get_if_addrs = "0.5"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
libaes = "0.7"
log = "0.4"
mdns-sd = { git = "https://github.com/Martichou/mdns-sd", branch = "unsolicited" }
mime_guess = "2.0"
num-bigint = "0.4"
once_cell = "1.20"
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.13"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sys_metrics = { git = "https://github.com/Martichou/sys_metrics" }
tokio = { version = "1.43", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10.0", features = ["serde-compat", "uuid-impl", "chrono-impl"] }
uuid = "1.15"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"], optional = true }
btleplug = { version = "0.11", optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[build-dependencies]
prost-build = "0.13"

[features]
default = []
experimental = ["bluer", "btleplug"]

# The vendored engine is upstream's code. Satella does not rewrite it, so the
# lints Satella's own crates must pass do not apply here.
[lints.clippy]
all = "allow"
pedantic = "allow"
nursery = "allow"
