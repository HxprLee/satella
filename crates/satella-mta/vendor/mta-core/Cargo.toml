[package]
name = "satella-mta-vendor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Vendored from Tinnci/cattysend (MIT), upstream commit
# c0b2c757279c051c8f1ecc408462ac5a2d53dd8b.
#
# The package is renamed so it cannot collide with the upstream
# `cattysend-core` crate. The sources are upstream's apart from the changes
# listed in ../../THIRD_PARTY_NOTICES.md, which include translated comments.

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# BLE
btleplug = "0.11"
bluer = { git = "https://github.com/Tinnci/bluer.git", branch = "feature/scan-response-data", features = ["full"] }

# Networking
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }

# TLS
native-tls = "0.2"
tokio-native-tls = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

# Compression
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
hostname = "0.4"
dirs = "5"
mime_guess = "2"
libc = "0.2"
toml = "0.8"

# D-Bus (NetworkManager integration)
zbus = { version = "4", default-features = false, features = ["tokio"] }

# The vendored engine is upstream's code. Satella does not rewrite it, so the
# lints Satella's own crates must pass do not apply here.
[lints.clippy]
all = "allow"
pedantic = "allow"
nursery = "allow"
