[package]
name = "satella-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A terminal harness for the Satella engine."

[lib]
name = "satella_cli"
path = "src/lib.rs"

[[bin]]
name = "satella-cli"
path = "src/main.rs"

[dependencies]
satella-core.workspace = true
satella-runtime.workspace = true
satella-localsend.workspace = true
satella-quickshare.workspace = true
satella-mta.workspace = true

anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# The desktop notifications of the daemon. The zbus version is the one the
# vendored MTA engine already uses, so the two share one copy of the D-Bus
# stack instead of pulling a second one in.
zbus = { version = "4", default-features = false, features = ["tokio"] }

dirs = "5"
libc = "0.2"
